# Serves the adblock lists from the local clone kept fresh by
# adblock-rules-sync.timer. Only adblock.txt and hosts.txt are exposed;
# every other path (including .git/) returns 404. TLS is terminated at
# the internal proxy, so this vhost is plain HTTP.
user http;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        listen [::]:80;
        server_name abp.markridgwell.com;

        root /var/lib/adblock-rules/credfeto-adblock-rules;

        location = /adblock.txt {
            default_type "text/plain; charset=utf-8";
            add_header Cache-Control "max-age=300";
        }

        location = /hosts.txt {
            default_type "text/plain; charset=utf-8";
            add_header Cache-Control "max-age=300";
        }

        location / {
            return 404;
        }
    }
}
