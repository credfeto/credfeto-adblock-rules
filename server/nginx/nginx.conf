# Serves the adblock lists from the local clone kept fresh by
# adblock-rules-sync.timer. Only adblock.txt and hosts.txt are aliased into
# the vhost - there is no document root, so nothing else in the clone
# (including .git/) is reachable and every other path returns 404. TLS is
# terminated at the internal proxy, so this vhost is plain HTTP.
user http;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;
    server_tokens off;
    charset utf-8;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        listen [::]:80;
        server_name abp.markridgwell.com;

        disable_symlinks on;
        add_header Cache-Control "max-age=300";

        location = /adblock.txt {
            alias /var/lib/adblock-rules/credfeto-adblock-rules/adblock.txt;
        }

        location = /hosts.txt {
            alias /var/lib/adblock-rules/credfeto-adblock-rules/hosts.txt;
        }

        location / {
            return 404;
        }
    }
}
