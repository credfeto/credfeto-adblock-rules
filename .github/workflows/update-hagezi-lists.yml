---  # Mirror the hagezi blocklists used by the DNS servers into this repo (see issue #622)
name: "Repo: Update hagezi blocklist mirror"
on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/update-hagezi-lists.yml"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-hagezi-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Check Required Secrets"
        shell: bash
        run: |
          if [ -z "${{secrets.SOURCE_PUSH_TOKEN}}" ]; then
            echo "::error::SOURCE_PUSH_TOKEN is required but not set"
            exit 1
          fi

      - name: "Initialise Workspace"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE"

      # SOURCE_PUSH_TOKEN must be an admin-owned classic PAT, not GITHUB_TOKEN:
      # pushing straight to main relies on branch protection's isAdminEnforced
      # being off, and only a PAT-made push starts the downstream pages deploy
      # workflow (pushes made with GITHUB_TOKEN do not trigger workflows).
      - name: "Checkout Source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          token: ${{secrets.SOURCE_PUSH_TOKEN}}
          persist-credentials: true

      - name: "Fetch upstream hagezi lists"
        id: fetch-upstream
        shell: bash
        run: |
          LISTS=(doh-vpn-proxy-bypass multi hoster)
          UPSTREAM_DIR="${{runner.temp}}/hagezi-upstream"
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            --branch main \
            https://github.com/hagezi/dns-blocklists.git \
            "$UPSTREAM_DIR"
          for LIST in "${LISTS[@]}"; do
            # Refuse anything but a regular file and extract the blob directly
            # rather than checking the worktree out: a symlink committed
            # upstream would otherwise be dereferenced by cp and could leak
            # runner-local files (such as .git/config with its credentials)
            # into the published mirror.
            MODE=$(git -C "$UPSTREAM_DIR" ls-tree main --format='%(objectmode)' -- "hosts/$LIST.txt")
            if [ "$MODE" != "100644" ]; then
              echo "::error::Upstream hosts/$LIST.txt is not a regular file (mode: ${MODE:-missing}); refusing to mirror"
              exit 1
            fi
            git -C "$UPSTREAM_DIR" cat-file blob "main:hosts/$LIST.txt" > "hagezi/$LIST.txt"
            if [ ! -s "hagezi/$LIST.txt" ]; then
              echo "::error::Upstream file hosts/$LIST.txt is missing or empty"
              exit 1
            fi
            if grep -q "$(printf '\r')" "hagezi/$LIST.txt"; then
              echo "::error::Upstream file hosts/$LIST.txt contains CR bytes; git text normalisation would break the byte-for-byte mirror"
              exit 1
            fi
          done
          UPSTREAM_SHA=$(git -C "$UPSTREAM_DIR" rev-parse HEAD)
          echo "Upstream hagezi/dns-blocklists commit: $UPSTREAM_SHA"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: "Commit changes"
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore(hagezi): update mirror to hagezi/dns-blocklists@${{steps.fetch-upstream.outputs.UPSTREAM_SHA}}"
          file_pattern: "hagezi/*.txt"
          commit_user_name: "hagezi-mirror[bot]"
          commit_user_email: "credfeto@users.noreply.github.com"
          commit_author: "hagezi-mirror[bot] <credfeto@users.noreply.github.com>"
          skip_dirty_check: false
